# Nginx — expõe a API com HTTPS.
#   sudo cp deploy/nginx-porondeapi.conf /etc/nginx/sites-available/porondeapi
#   sudo ln -s /etc/nginx/sites-available/porondeapi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.SEU-DOMINIO   # certificado gratuito (Let's Encrypt)

server {
    listen 80;
    server_name api.SEU-DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
